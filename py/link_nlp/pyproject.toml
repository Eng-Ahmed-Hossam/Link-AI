[project]
name = "link-nlp"
version = "0.1.0"
description = "Deterministic Egyptian Arabic draft extraction and roster identity safeguards"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema>=4.23", "link-eval"]

[tool.uv.sources]
link-eval = { path = "../../evals", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache"]

[tool.mypy]
strict = true
files = ["link_nlp", "../../evals/link_eval", "../../evals/reference_rules.py"]
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../evals/tests"]
