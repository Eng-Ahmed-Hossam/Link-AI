name: ci
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # ai-service (Python): pnpm lint/typecheck/test run ruff, mypy and pytest through uv.
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory apps/ai-service --locked
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm i18n:check
