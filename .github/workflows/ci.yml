name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # ai-service (Python): pnpm lint/typecheck/test run ruff, mypy and pytest through uv.
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory apps/ai-service --locked
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm run i18n:check
      - run: pnpm run env:check
      # The OpenAPI document and the api-client types match the core-api contract.
      - run: pnpm openapi:check
      - run: npx prettier --check .
      # The public demo build carries no presenter tools ("Demo tools", Demo controls).
      - run: pnpm check:public-demo

  # core-api against real Postgres (PostGIS), Redis and aws-local: migrations up, schema types in
  # sync, integration + events + the cross-tenant RLS suite (pnpm test:api runs both).
  core-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/env-local.mjs
      - uses: ./.github/actions/docker-mirror
      - name: Start Postgres, Redis and aws-local
        run: docker compose -f infra/local/docker-compose.yml --env-file .env.local up -d --build --wait --wait-timeout 300 postgres redis-cache redis-state aws-local
      - run: pnpm db:migrate
      - name: Kysely row types match the migrated schema
        run: pnpm db:types && git diff --exit-code apps/core-api/src/db/schema.ts
      - run: pnpm test:api
      - run: pnpm test:money
      # Backups (docs/operations.md): an encrypted backup of the test database, restored into a
      # fresh database, and the cross-tenant RLS suite run against the restored copy.
      - name: Backup → restore → RLS suite on the restored copy
        run: |
          export BACKUP_PASSPHRASE="ci-$(openssl rand -hex 16)" BACKUP_DIR="$RUNNER_TEMP/backups" ENV_FILE=/nonexistent PG_DATABASE=link_test
          export PG_EXEC="docker compose -f infra/local/docker-compose.yml --env-file .env.local exec -T postgres"
          deploy/backup.sh
          deploy/restore.sh "$(ls -t "$BACKUP_DIR"/*.dump.enc | head -1)" link_test_restored
          TEST_DB_NAME=link_test_restored pnpm test:rls

  # The production images (ship job S1): built to prove they build; never pushed anywhere.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/docker-mirror
      - name: core-api (api, worker, gateway, migrate)
        run: docker build -f apps/core-api/Dockerfile -t link/core-api:ci .
      - name: web (production)
        run: docker build -f apps/web/Dockerfile -t link/web:ci --build-arg NEXT_PUBLIC_SITE_URL=https://link.example .
      - name: ai-service
        run: docker build -f apps/ai-service/Dockerfile -t link/ai-service:ci .
      - name: The production guard refuses local settings
        run: |
          out=$(docker run --rm -e LINK_ENV=production -e APP_ENV=staging -e DATABASE_URL=postgres://x@db/link -e DATABASE_URL_WORKER=postgres://x@db/link -e REDIS_CACHE_URL=redis://r -e REDIS_STATE_URL=redis://r -e HMAC_KEY_LOOKUP=$(openssl rand -hex 32) -e FIELD_KEY=$(openssl rand -base64 32) -e JWT_ISSUER=http://localhost:4000 -e JWT_AUDIENCE=link -e JWT_SIGNING_KEY_ID=local-dev -e JWT_SIGNING_KEY=$(openssl rand -base64 32) -e PAYMENT_PROVIDER=none -e PAYMENT_WEBHOOK_SECRET=$(openssl rand -hex 16) -e WHATSAPP_PROVIDER=manual -e WHATSAPP_WEBHOOK_SECRET=$(openssl rand -hex 16) -e SMS_PROVIDER=fake -e SMS_SINK_URL=http://sms-sink:8090 link/core-api:ci api 2>&1 || true)
          echo "$out" | grep -v '^{'
          echo "$out" | grep -q 'Refusing to start with LINK_ENV=production'
          echo "$out" | grep -q 'SMS_SINK_URL'
      - name: Image sizes
        run: docker images --format '{{.Repository}}:{{.Tag}}  {{.Size}}' --filter 'reference=link/*'

  # The connected story in LIVE mode (real core-api, Postgres, sign-in codes from sms-sink): every
  # push to main and every pull request into main (decided 2026-10-09; PRs since R4). A newer push
  # to the PR cancels the older run (concurrency above). The full live e2e suite runs on demand or
  # nightly (e2e-live.yml).
  story-live:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/env-local.mjs
      - uses: ./.github/actions/docker-mirror
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @link/web exec playwright install --with-deps chromium
      # pnpm dev (started by the Playwright config): services, migrations, seed, core-api, web, teacher app.
      - run: node scripts/e2e-modes.mjs live story.spec.ts
        env: { CI: '1' }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: story-live-traces
          path: apps/web/test-results
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The Arabic NLP core and the evaluation kit (gold lock included).
      - run: uv sync --directory py/link_nlp --locked
      - run: uv run --directory py/link_nlp ruff check .
      - run: uv run --directory py/link_nlp mypy
      - run: uv run --directory py/link_nlp pytest -q
      - run: uv run --directory py/link_nlp pytest -q ../../evals/tests
      - run: uv run --directory py/link_nlp python -m link_eval selftest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Every commit of the history, not just the last one.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
