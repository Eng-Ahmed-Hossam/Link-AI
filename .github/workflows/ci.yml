name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # ai-service (Python): pnpm lint/typecheck/test run ruff, mypy and pytest through uv.
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory apps/ai-service --locked
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm run i18n:check
      - run: pnpm run env:check
      # The OpenAPI document and the api-client types match the core-api contract.
      - run: pnpm openapi:check
      - run: npx prettier --check .
      # The public demo build carries no presenter tools ("Demo tools", Demo controls).
      - run: pnpm check:public-demo

  # core-api against real Postgres (PostGIS), Redis and aws-local: migrations up, schema types in
  # sync, integration + events + the cross-tenant RLS suite (pnpm test:api runs both).
  core-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/env-local.mjs
      - name: Start Postgres, Redis and aws-local
        run: docker compose -f infra/local/docker-compose.yml --env-file .env.local up -d --build --wait --wait-timeout 300 postgres redis-cache redis-state aws-local
      - run: pnpm db:migrate
      - name: Kysely row types match the migrated schema
        run: pnpm db:types && git diff --exit-code apps/core-api/src/db/schema.ts
      - run: pnpm test:api
      - run: pnpm test:money

  # The connected story in LIVE mode (real core-api, Postgres, sign-in codes from sms-sink): every
  # push to main (decided 2026-10-09). The full live e2e suite runs on demand or nightly (e2e-live.yml).
  story-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/env-local.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @link/web exec playwright install --with-deps chromium
      # pnpm dev (started by the Playwright config): services, migrations, seed, core-api, web, teacher app.
      - run: node scripts/e2e-modes.mjs live story.spec.ts
        env: { CI: '1' }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: story-live-traces
          path: apps/web/test-results
          retention-days: 7

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The Arabic NLP core and the evaluation kit (gold lock included).
      - run: uv sync --directory py/link_nlp --locked
      - run: uv run --directory py/link_nlp ruff check .
      - run: uv run --directory py/link_nlp mypy
      - run: uv run --directory py/link_nlp pytest -q
      - run: uv run --directory py/link_nlp pytest -q ../../evals/tests
      - run: uv run --directory py/link_nlp python -m link_eval selftest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Every commit of the history, not just the last one.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
