name: e2e-live
# The full live-mode e2e suite (apps/web/e2e-modes against pnpm dev): on demand and nightly.
# The per-push run on main covers the connected story only (ci.yml, story-live).
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC
permissions:
  contents: read
jobs:
  e2e-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node scripts/env-local.mjs
      - uses: ./.github/actions/docker-mirror
      - run: pnpm --filter @link/web exec playwright install --with-deps chromium
      - run: node scripts/e2e-modes.mjs live
        env: { CI: '1' }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live-traces
          path: apps/web/test-results
          retention-days: 7
